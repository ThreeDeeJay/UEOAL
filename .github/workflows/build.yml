# SPDX-License-Identifier: GPL-3.0-or-later
# UEOAL - GitHub Actions CI/CD
# Builds XAudio2_9.dll + xaudio2_9redist.dll for Win32 and x64,
# packages each architecture into a versioned ZIP, and publishes a
# GitHub Release on every push to main/dev.
#
# Release tag naming:
#   Branch push  ->  latest-<branch>   (e.g. latest-main)   [prerelease, overwritten each push]
#   Semver tag   ->  v1.2.3                                  [full release]

name: Build UEOAL

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.config }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        config: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract version and release metadata
        id: ver
        shell: bash
        run: |
          # grep -P fails on Windows runners (unibyte/UTF-8 locale error).
          # Use sed with BRE instead.
          TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(sed -n 's/.*project(UEOAL[[:space:]]*VERSION[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt | head -1)
          fi
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          # Determine release tag and whether this is a prerelease.
          # On a semver tag push: use the tag itself as the release tag.
          # On a branch push:     use latest-<branch> so each push overwrites
          #                       the same rolling release for that branch.
          REF="${{ github.ref }}"
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$REF_NAME"
            IS_PRERELEASE="false"
          else
            RELEASE_TAG="latest-${REF_NAME}"
            IS_PRERELEASE="true"
          fi

          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_SHORT"       >> "$GITHUB_OUTPUT"
          echo "zip_name=UEOAL-${VERSION}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG"   >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  Commit: $COMMIT_SHORT  Tag: $RELEASE_TAG  Prerelease: $IS_PRERELEASE"

      # Split into two steps: GitHub Actions does not support ternary
      # operators inside action input values.
      - name: Set up MSVC (x64)
        if: matrix.arch == 'x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up MSVC (x86)
        if: matrix.arch == 'x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot --depth 1
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies via vcpkg (${{ matrix.arch }})
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "x86") { "x86-windows" } else { "x64-windows" }
          # In manifest mode vcpkg reads vcpkg.json automatically.
          # Do NOT pass individual package names - that is only valid in classic mode.
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet $triplet `
            --x-manifest-root "${{ github.workspace }}" `
            --clean-after-build

      - name: Configure CMake (${{ matrix.arch }})
        shell: pwsh
        run: |
          $triplet  = if ("${{ matrix.arch }}" -eq "x86") { "x86-windows" } else { "x64-windows" }
          $platform = if ("${{ matrix.arch }}" -eq "x86") { "Win32" } else { "x64" }
          $buildDir = "build-${{ matrix.arch }}"
          cmake -B $buildDir `
            -A $platform `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install-${{ matrix.arch }}"

      - name: Build (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake --build "build-${{ matrix.arch }}" `
            --config ${{ matrix.config }} `
            --parallel

      - name: Install (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake --install "build-${{ matrix.arch }}" --config ${{ matrix.config }}

      - name: List build outputs (${{ matrix.arch }})
        shell: pwsh
        run: |
          Write-Host "=== install tree ==="
          Get-ChildItem -Recurse "install-${{ matrix.arch }}" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== build config dir ==="
          Get-ChildItem -Recurse "build-${{ matrix.arch }}\${{ matrix.config }}" -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize

      - name: Package ZIP (${{ matrix.arch }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $commit  = "${{ steps.ver.outputs.commit }}"
          $arch    = "${{ matrix.arch }}"
          $config  = "${{ matrix.config }}"
          $zipName = "${{ steps.ver.outputs.zip_name }}"
          $stagDir = "${{ github.workspace }}\staging\$zipName"

          New-Item -ItemType Directory -Force -Path $stagDir | Out-Null

          # Locate a DLL by name, checking the install tree first, then the
          # build config dir, then doing a full recursive search as last resort.
          function Find-Dll {
            param([string]$Name)
            $candidates = @(
              "install-$arch\bin\$Name",
              "build-$arch\$config\$Name"
            )
            foreach ($c in $candidates) {
              $f = Get-Item $c -ErrorAction SilentlyContinue
              if ($f) { return $f }
            }
            # Recursive fallback - catches any unexpected CMake output layout
            $f = Get-ChildItem -Recurse -Filter $Name `
                   -Path "build-$arch","install-$arch" `
                   -ErrorAction SilentlyContinue |
                 Select-Object -First 1
            return $f
          }

          # Copy both DLL variants. CMake builds two targets:
          #   XAudio2_9.dll       - Mode A (system XAudio2 / UE5 / newer UE4)
          #   xaudio2_9redist.dll - Mode B (UE4 games shipping the XAudio2 redist)
          $requiredDlls = @("XAudio2_9.dll", "xaudio2_9redist.dll")
          foreach ($dll in $requiredDlls) {
            $found = Find-Dll $dll
            if ($found) {
              Copy-Item $found.FullName $stagDir
              Write-Host "OK  $dll  <-  $($found.FullName)"
            } else {
              # Write-Error stops the step immediately so a missing DLL is
              # never silently omitted from the release.
              Write-Error "MISSING: $dll not found anywhere under build-$arch or install-$arch"
            }
          }

          # PDBs (optional, aids crash reporting)
          Get-ChildItem -Recurse "build-$arch\$config" -Filter "*.pdb" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $stagDir; Write-Host "PDB $($_.Name)" }

          # OpenAL Soft runtime DLL
          $oalDll = Get-ChildItem "$env:VCPKG_ROOT\installed\$arch-windows\bin\OpenAL32.dll" `
                      -ErrorAction SilentlyContinue
          if ($oalDll) {
            Copy-Item $oalDll.FullName $stagDir
            Write-Host "OK  OpenAL32.dll"
          } else {
            Write-Error "MISSING: OpenAL32.dll not found in vcpkg installed tree"
          }

          Copy-Item "README.md" $stagDir -ErrorAction SilentlyContinue
          Copy-Item "LICENSE"   $stagDir -ErrorAction SilentlyContinue

          # Version manifest.
          # Avoid PowerShell here-strings: their closing "@ must be at column 0
          # which conflicts with YAML block scalar indentation.
          $builtAt = (Get-Date -Format 'yyyy-MM-dd HH:mm:ss') + ' UTC'
          "UEOAL $version ($arch)`nCommit : $commit`nBuilt  : $builtAt" |
            Out-File -FilePath "$stagDir\VERSION.txt" -Encoding utf8

          Write-Host ""
          Write-Host "=== Staging contents ==="
          Get-ChildItem $stagDir | Format-Table Name, Length -AutoSize

          Compress-Archive -Path "$stagDir\*" `
            -DestinationPath "${{ github.workspace }}\${zipName}.zip" `
            -Force

          Write-Host "ZIP created: ${zipName}.zip"

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zip_name }}
          path: ${{ github.workspace }}/${{ steps.ver.outputs.zip_name }}.zip
          retention-days: 30

  # Publish a GitHub Release on every push to main/dev (rolling latest-<branch>)
  # and on every semver tag push (versioned release).
  # Pull requests are excluded via the job-level if condition.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      # Pass the release_tag output from the build matrix.
      # Both matrix legs compute the same value so we read it from the x64 leg.
      - name: Resolve release metadata
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=$GITHUB_REF_NAME"   >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false"            >> "$GITHUB_OUTPUT"
            echo "release_name=UEOAL $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=latest-${GITHUB_REF_NAME}"   >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true"                      >> "$GITHUB_OUTPUT"
            echo "release_name=UEOAL latest-${GITHUB_REF_NAME} (rolling)" >> "$GITHUB_OUTPUT"
          fi

      # download-artifact@v4 places each artifact in its own subdirectory.
      # merge-multiple: true flattens them all into release-assets/.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          echo "=== release-assets contents ==="
          ls -lh release-assets/
          # Fail if no ZIPs were collected
          count=$(find release-assets -name "*.zip" | wc -l)
          echo "ZIP count: $count"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no ZIP files found in release-assets" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.meta.outputs.release_name }}
          tag_name: ${{ steps.meta.outputs.release_tag }}
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          make_latest: ${{ steps.meta.outputs.is_prerelease == 'false' }}
          fail_on_unmatched_files: true
          body: |
            ## ${{ steps.meta.outputs.release_name }}

            OpenAL Soft-based 3D audio spatializer / XAudio2 proxy for Unreal Engine 4/5 games.

            **Commit:** `${{ github.sha }}`  |  **Ref:** `${{ github.ref_name }}`

            ---

            ### Mode A: System XAudio2 (UE5 / most modern UE4)
            1. Download the ZIP for your architecture (most games are **x64**).
            2. Copy `XAudio2_9.dll` and `OpenAL32.dll` next to the game `.exe`.
            3. Launch the game.

            ### Mode B: XAudio2 Redistributable (older UE4 games)
            Some UE4 games load XAudio2 from a bundled path such as:
            `Engine\Binaries\ThirdParty\Windows\XAudio2_9\x64\xaudio2_9redist.dll`
            1. Go to that folder.
            2. Rename `xaudio2_9redist.dll` to `xaudio2_9redist_real.dll`.
            3. Copy UEOAL's `xaudio2_9redist.dll` and `OpenAL32.dll` into that same folder.
            4. Launch the game.

            ### Verbose logging
            ```bat
            set UEOAL_LOG_PATH=C:\ueoal.log
            ```
            Attach `ueoal.log` to any bug reports.
            For path-resolution issues, use [Sysinternals DebugView](https://learn.microsoft.com/en-us/sysinternals/downloads/debugview) (enable **Capture Win32**) -- UEOAL emits diagnostics via `OutputDebugString` even without the log file.

            ### Notes
            - `OpenAL32.dll` must sit in the same folder as the UEOAL DLL.
            - Tested on UE 4.27 and UE 5.x.
            - Source available under GPLv3.
          files: release-assets/*.zip
