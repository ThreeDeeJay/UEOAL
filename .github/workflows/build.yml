# SPDX-License-Identifier: GPL-3.0-or-later
# UEOAL - GitHub Actions CI/CD
# Builds XAudio2_9.dll for Win32 and x64, packages each into a versioned ZIP.

name: Build UEOAL

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.config }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        config: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract version
        id: ver
        shell: bash
        run: |
          # Try tag first, fall back to parsing CMakeLists.txt.
          # grep -P is avoided: it fails on Windows runners with
          # "supports only unibyte and UTF-8 locales". Use sed with BRE instead.
          TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(sed -n 's/.*project(UEOAL[[:space:]]*VERSION[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt | head -1)
          fi
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_SHORT" >> "$GITHUB_OUTPUT"
          echo "zip_name=UEOAL-${VERSION}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION  commit: $COMMIT_SHORT"

      # Split into two steps: GitHub Actions expression syntax does not support
      # ternary operators inside action input values.
      - name: Set up MSVC (x64)
        if: matrix.arch == 'x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up MSVC (x86)
        if: matrix.arch == 'x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot --depth 1
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies via vcpkg (${{ matrix.arch }})
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "x86") { "x86-windows" } else { "x64-windows" }
          # In manifest mode vcpkg reads vcpkg.json automatically.
          # Do NOT pass individual package names - that is only valid in classic mode.
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet $triplet `
            --x-manifest-root "${{ github.workspace }}" `
            --clean-after-build

      - name: Configure CMake (${{ matrix.arch }})
        shell: pwsh
        run: |
          $triplet  = if ("${{ matrix.arch }}" -eq "x86") { "x86-windows" } else { "x64-windows" }
          $platform = if ("${{ matrix.arch }}" -eq "x86") { "Win32" } else { "x64" }
          $buildDir = "build-${{ matrix.arch }}"
          cmake -B $buildDir `
            -A $platform `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install-${{ matrix.arch }}"

      - name: Build (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake --build "build-${{ matrix.arch }}" `
            --config ${{ matrix.config }} `
            --parallel

      - name: Install (${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake --install "build-${{ matrix.arch }}" --config ${{ matrix.config }}

      - name: Package ZIP (${{ matrix.arch }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $commit  = "${{ steps.ver.outputs.commit }}"
          $arch    = "${{ matrix.arch }}"
          $zipName = "${{ steps.ver.outputs.zip_name }}"
          $stagDir = "${{ github.workspace }}\staging\$zipName"

          New-Item -ItemType Directory -Force -Path $stagDir | Out-Null

          # Copy DLL (prefer install tree, fall back to build tree)
          $dllPath = Get-ChildItem "install-$arch\bin\XAudio2_9.dll" -ErrorAction SilentlyContinue
          if (-not $dllPath) {
            $dllPath = Get-ChildItem "build-$arch\${{ matrix.config }}\XAudio2_9.dll" -ErrorAction SilentlyContinue
          }
          if ($dllPath) { Copy-Item $dllPath.FullName $stagDir }

          # Copy PDB if present
          $pdbPath = Get-ChildItem "build-$arch\${{ matrix.config }}\*.pdb" -ErrorAction SilentlyContinue
          if ($pdbPath) { Copy-Item $pdbPath.FullName $stagDir }

          # Copy OpenAL Soft runtime DLL
          $oalDll = Get-ChildItem "$env:VCPKG_ROOT\installed\$arch-windows\bin\OpenAL32.dll" -ErrorAction SilentlyContinue
          if ($oalDll) { Copy-Item $oalDll.FullName $stagDir }

          # Copy README / LICENSE
          Copy-Item "README.md" $stagDir -ErrorAction SilentlyContinue
          Copy-Item "LICENSE"   $stagDir -ErrorAction SilentlyContinue

          # Write version manifest.
          # PowerShell here-strings (@" "@) require the closing "@ at column 0,
          # which conflicts with YAML block indentation - use Out-File instead.
          $builtAt = (Get-Date -Format 'yyyy-MM-dd HH:mm:ss') + ' UTC'
          "UEOAL $version ($arch)`nCommit : $commit`nBuilt  : $builtAt" |
            Out-File -FilePath "$stagDir\VERSION.txt" -Encoding utf8

          Compress-Archive -Path "$stagDir\*" `
            -DestinationPath "${{ github.workspace }}\${zipName}.zip" `
            -Force

          Write-Host "ZIP created: ${zipName}.zip"

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zip_name }}
          path: ${{ github.workspace }}/${{ steps.ver.outputs.zip_name }}.zip
          retention-days: 30

  # Only runs when a version tag is pushed (e.g. v1.0.1)
  # Runs only when a version tag is pushed (e.g. git tag v1.0.6 && git push --tags)
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      # download-artifact@v4 places each artifact in its own subdirectory named
      # after the artifact. merge-multiple: true flattens them all into one folder.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "UEOAL ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true
          body: |
            ## UEOAL ${{ github.ref_name }}

            OpenAL Soft-based 3D audio spatializer / XAudio2 proxy for Unreal Engine 4/5 games.

            ### Installation
            1. Download the ZIP matching your game's architecture (most UE games are **x64**).
            2. Extract `XAudio2_9.dll` and `OpenAL32.dll` into the game root directory
               (same folder as the game `.exe`).
            3. Launch the game - HRTF binaural audio is now active.

            ### Enabling verbose logging
            Set the environment variable `UEOAL_LOG_PATH` before launching the game:
            ```bat
            set UEOAL_LOG_PATH=C:\ueoal.log
            ```

            ### Notes
            - `OpenAL32.dll` (bundled) must sit alongside `XAudio2_9.dll`.
            - Tested on UE 4.27 and UE 5.x.
            - Source available under GPLv3.
          files: release-assets/*.zip
